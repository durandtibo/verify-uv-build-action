name: "Verify uv build"
description: "Build a Python package with uv and verify the wheel and sdist."

author: "Thibaut Durand"

branding:
  icon: "check-circle"
  color: "blue"

inputs:
  package-name:
    description: |
      The name used to install the package. It is also known as
      distribution name. For example, it is the name on PyPI. Optional:
      when empty, it is read from the built wheel. When set, it is
      asserted equal to the name in the metadata (normalized).
    required: false
    default: ""
  module-name:
    description: |
      The name used in import statements. This input is optional
      and the package name is used if no module name is provided.
      The hyphens and dots in the package name will be replaced by
      underscores. A dot in a given module name means a sub-package
      (a.b is checked as a/b/py.typed).
    required: false
    default: ""
  package-extras:
    description: |
      The package extra(s) to install and verify. A comma-separated
      list is accepted (<extra1>,<extra2>).
    required: false
    default: ""
  package-dependencies:
    description: |
      A list of comma-separated direct dependencies that must be
      installed <dependency1>,<dependency2>,<dependency3> ...
    required: false
    default: ""
  dist-type:
    description: |
      The distribution artifact that is installed and tested. Choose
      wheel, sdist or both. Both artifacts are always built and
      inspected, whatever the value.
    required: false
    default: "both"
  python-version:
    description: "Python version to use"
    required: false
    default: "3.13"
  project-path:
    description: |
      Directory that contains the pyproject.toml file to build. Use it
      for monorepos.
    required: false
    default: "."
  twine-version:
    description: |
      Version of twine used by `twine check`. Empty means the version
      pinned in scripts/requirements.txt.
    required: false
    default: ""
  pyright-version:
    description: |
      Version of pyright used by `pyright --verifytypes`. Empty means the
      version pinned in scripts/requirements.txt. It is ignored when
      check-types is false.
    required: false
    default: ""
  check-types:
    description: |
      Whether to check the py.typed marker and the type completeness
      with pyright. Set to false for intentionally untyped packages.
      Choose either true or false.
    required: false
    default: "true"

outputs:
  wheel-path:
    description: "Absolute path of the built wheel"
    value: ${{ steps.verify.outputs.wheel-path }}
  sdist-path:
    description: "Absolute path of the built sdist"
    value: ${{ steps.verify.outputs.sdist-path }}
  dist-dir:
    description: "Directory that holds the wheel and the sdist"
    value: ${{ steps.verify.outputs.dist-dir }}
  version:
    description: "Version from the built wheel metadata"
    value: ${{ steps.verify.outputs.version }}

runs:
  using: "composite"
  steps:
    # Step 1: install uv and Python. No environment is activated and
    # nothing is created in the workspace.
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ inputs.python-version }}

    # Step 2: validate, build, check the archives, install, check the
    # installation and the types, and write the job summary (verdict, failed
    # phase, reason, content of the archives), also when a check failed. See
    # scripts/verify.sh for the phases. The same script runs locally:
    # PACKAGE_NAME=<name> bash scripts/verify.sh
    - name: Verify
      id: verify
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.package-name }}
        MODULE_NAME: ${{ inputs.module-name }}
        PACKAGE_EXTRAS: ${{ inputs.package-extras }}
        PACKAGE_DEPENDENCIES: ${{ inputs.package-dependencies }}
        DIST_TYPE: ${{ inputs.dist-type }}
        PROJECT_PATH: ${{ inputs.project-path }}
        TWINE_VERSION: ${{ inputs.twine-version }}
        PYRIGHT_VERSION: ${{ inputs.pyright-version }}
        CHECK_TYPES: ${{ inputs.check-types }}
      run: |
        set -euo pipefail
        bash "$GITHUB_ACTION_PATH/scripts/verify.sh"
