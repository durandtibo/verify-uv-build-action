name: "Verify uv build"
description: "Verify the uv build artifacts"

author: "Thibaut Durand"

branding:
  icon: "check-circle"
  color: "blue"

inputs:
  package-name:
    description: |
      The name used to install the package. It is also known as
      distribution name. For example, it is the name on PyPI.
    required: true
  module-name:
    description: |
      The name used in import statements. This input is optional
      and the package name is used if no module name is provided.
      The hyphens in the package name will be replaced by
      underscores.
    required: false
    default: ""
  package-extra:
    description: "The package extra to install"
    required: false
    default: ""
  package-dependencies:
    description: |
      A list of comma-separated required dependencies
      <dependency1>,<dependency2>,<dependency3> ...
    required: false
    default: ""
  dist-type:
    description: |
      The distribution artifact. Choose either wheel or sdist
    required: false
    default: "wheel"
  python-version:
    description: "Python version to use"
    required: false
    default: "3.13"
  verify-wheel-extra:
    description: |
      Whether to verify the wheel extra is defined in metadata
    required: false
    default: "true"
  verify-sdist-extra:
    description: |
      Whether to verify the sdist extra is defined in metadata
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    # Validate dist-type input
    - name: Verify dist-type
      shell: bash
      env:
        DIST_TYPE: ${{ inputs.dist-type }}
      run: |
        set -euo pipefail
        if [[ "$DIST_TYPE" != "wheel" && "$DIST_TYPE" != "sdist" ]]; then
          echo "❌ Error: input 'dist-type' must be 'wheel' or 'sdist'."
          exit 1
        fi
        echo "✅ Distribution type: $DIST_TYPE"

    # Install uv package manager
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # ratchet:astral-sh/setup-uv@v7
      with:
        python-version: ${{ inputs.python-version }}
        activate-environment: true

    # Build the package
    - name: Build package
      shell: bash
      run: |
        set -euo pipefail
        echo "📦 Building package..."
        uv build
        echo "✅ Build completed"

    # Find wheel and sdist paths
    - name: Find distribution paths
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        wheels=(dist/*.whl)
        sdists=(dist/*.tar.gz)

        if [ ${#wheels[@]} -eq 0 ]; then
          echo "❌ Error: No wheel distribution found"
          exit 1
        fi
        if [ ${#sdists[@]} -eq 0 ]; then
          echo "❌ Error: No sdist distribution found"
          exit 1
        fi

        echo "📄 Found wheel file: ${wheels[0]}"
        echo "📄 Found sdist file: ${sdists[0]}"
        {
          echo "WHEEL_PATH=${wheels[0]}"
          echo "SDIST_PATH=${sdists[0]}"
        } >> "$GITHUB_ENV"

    # Verify py.typed marker exists in wheel
    - name: Check py.typed in wheel distribution
      shell: bash
      run: |
        set -euo pipefail
        # Capture first: `grep -q` in a pipe can trigger SIGPIPE under pipefail
        output=$(unzip -Z1 "$WHEEL_PATH")
        if grep -q 'py\.typed$' <<<"$output"; then
          echo "✅ py.typed marker found in wheel"
        else
          echo "❌ Error: py.typed marker not found in wheel"
          exit 1
        fi

    # Verify py.typed marker exists in sdist
    - name: Check py.typed in sdist distribution
      shell: bash
      run: |
        set -euo pipefail
        output=$(tar -tzf "$SDIST_PATH")
        if grep -q 'py\.typed$' <<<"$output"; then
          echo "✅ py.typed marker found in sdist"
        else
          echo "❌ Error: py.typed marker not found in sdist"
          exit 1
        fi

    # Verify extra is defined in wheel metadata
    - name: Verify extra is defined in wheel metadata
      shell: bash
      if: ${{ inputs.verify-wheel-extra == 'true' }}
      env:
        PACKAGE_EXTRA: ${{ inputs.package-extra }}
      run: |
        set -euo pipefail
        echo "🔍 Verifying extra is defined in wheel metadata..."
        bash "$GITHUB_ACTION_PATH/scripts/verify_wheel_extras.sh" \
          "$WHEEL_PATH" "$PACKAGE_EXTRA"
        echo "✅ wheel extra checks passed"

    # Verify extra is defined in sdist metadata
    - name: Verify extra is defined in sdist metadata
      shell: bash
      if: ${{ inputs.verify-sdist-extra == 'true' }}
      env:
        PACKAGE_EXTRA: ${{ inputs.package-extra }}
      run: |
        set -euo pipefail
        echo "🔍 Verifying extra is defined in sdist metadata..."
        bash "$GITHUB_ACTION_PATH/scripts/verify_sdist_extras.sh" \
          "$SDIST_PATH" "$PACKAGE_EXTRA"
        echo "✅ sdist extra checks passed"

    # Install the built package from the selected distribution
    - name: Install built package
      shell: bash
      env:
        DIST_TYPE: ${{ inputs.dist-type }}
        PACKAGE_EXTRA: ${{ inputs.package-extra }}
      run: |
        set -euo pipefail
        if [ "$DIST_TYPE" = "wheel" ]; then
          PKG="$WHEEL_PATH"
        else
          PKG="$SDIST_PATH"
        fi
        echo "📄 Using $DIST_TYPE distribution: $PKG"

        if [ -n "$PACKAGE_EXTRA" ]; then
          PKG="${PKG}[${PACKAGE_EXTRA}]"
          echo "📦 Installing package with extra: $PACKAGE_EXTRA"
        else
          echo "📦 Installing package..."
        fi
        uv pip install "$PKG"
        echo "✅ Package installed successfully"

    # Validate package metadata with twine
    - name: Install and run twine check
      shell: bash
      run: |
        set -euo pipefail
        if uv pip install twine 2>/dev/null; then
          echo "🔍 Running twine check..."
          twine check dist/*
          echo "✅ Twine check passed"
        else
          echo "⚠️  Twine not available, skipping validation"
        fi

    # Verify package metadata
    - name: Check package metadata
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.package-name }}
        PACKAGE_DEPENDENCIES: ${{ inputs.package-dependencies }}
      run: |
        set -euo pipefail
        echo "🔍 Checking package metadata..."
        bash "$GITHUB_ACTION_PATH/scripts/check_metadata.sh" \
          "$PACKAGE_NAME" "$PACKAGE_DEPENDENCIES"
        echo "✅ Metadata checks passed"

    # Verify dependency tree
    - name: Check dependency tree
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.package-name }}
        PACKAGE_DEPENDENCIES: ${{ inputs.package-dependencies }}
      run: |
        set -euo pipefail
        echo "🔍 Checking dependency tree..."
        bash "$GITHUB_ACTION_PATH/scripts/check_dependency_tree.sh" \
          "$PACKAGE_NAME" "$PACKAGE_DEPENDENCIES"
        echo "✅ Dependency tree checks passed"

    # Determine module name from package name
    - name: Find module name
      shell: bash
      env:
        INPUT_MODULE_NAME: ${{ inputs.module-name }}
        PACKAGE_NAME: ${{ inputs.package-name }}
      run: |
        set -euo pipefail
        MODULE_NAME="$INPUT_MODULE_NAME"
        if [ -z "$MODULE_NAME" ]; then
          MODULE_NAME="${PACKAGE_NAME//-/_}"
        fi
        echo "MODULE_NAME=$MODULE_NAME"
        echo "MODULE_NAME=$MODULE_NAME" >> "$GITHUB_ENV"

    # Test package import and version
    - name: Verify package import and version
      shell: bash
      run: |
        set -euo pipefail
        echo "🔍 Testing package import..."

        VERSION=$(python -c \
          "import $MODULE_NAME; print($MODULE_NAME.__version__)")
        echo "📌 Package version: $VERSION"

        if [ "$VERSION" = "0.0.0" ]; then
          echo "❌ Error: Package version is placeholder '0.0.0'"
          exit 1
        fi

        echo "✅ Package imported successfully with valid version"

    # Validate type hints with pyright
    - name: Check package type hints
      shell: bash
      run: |
        set -euo pipefail
        if uv pip install pyright 2>/dev/null; then
          echo "🔍 Running type hint validation..."
          bash "$GITHUB_ACTION_PATH/scripts/check_type.sh" "$MODULE_NAME"
        else
          echo "⚠️  Pyright not available, skipping type check"
        fi

    # Display artifact contents for debugging
    - name: Show artifacts
      shell: bash
      if: always()
      run: |
        set -uo pipefail
        for f in "${WHEEL_PATH:-}" "${SDIST_PATH:-}"; do
          [ -n "$f" ] || continue
          echo "🔍 Show content of $f"
          case "$f" in
            *.whl) unzip -l "$f" ;;
            *) tar -tzf "$f" ;;
          esac
          echo ""
        done
