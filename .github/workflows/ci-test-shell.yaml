# Shell unit test workflow.
# Runs the bats unit tests of the action's shell scripts on every OS of the matrix.

name: Shell Unit Tests

on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install bats-core (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "📦 Installing bats-core..."
          sudo apt-get update -qq
          sudo apt-get install -y bats
          echo "✅ Installation complete"

      - name: Install bats-core (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "🍺 Installing bats-core..."
          brew update
          brew install bats-core
          echo "✅ Installation complete"

      - name: Verify bats installation
        run: |
          echo "✓ Verifying bats installation..."
          bats --version
          echo "✅ bats is installed and ready"

      - name: Run unit tests
        run: |
          echo "🧪 Running tests on ${{ matrix.os }}..."
          bats --recursive tests/bats
          echo "✅ All tests passed"
