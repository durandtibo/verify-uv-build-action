# Shell unit tests workflow.
# Runs the bats tests of the shell scripts on multiple operating systems.

name: Shell Unit Tests
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install bats-core
        shell: bash
        # The apt package of Ubuntu 22.04 is bats 1.2.1 but the tests need >= 1.5
        # (bats_require_minimum_version), so install a pinned release from source.
        run: |
          set -euo pipefail
          if [ "$(uname -s)" = "Linux" ]; then
            git clone --depth 1 --branch v1.11.1 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
            sudo "$RUNNER_TEMP/bats-core/install.sh" /usr/local
          else
            make install-bats
          fi

      - name: Show the versions of bash and bats
        run: |
          bash --version | head -n 1
          bats --version

      - name: Run unit tests
        run: make test-shell
