# Workflow testing the action in a real workflow. One file tests both versions:
#   - use-released: false (default, called by ci.yaml): the action from the current checkout
#     (uses: ./), i.e. the version that is not released yet.
#   - use-released: true (called by nightly.yaml): the latest released action, to catch
#     regressions in what consumers pick up. Update the pinned release below when a new
#     version is released (bot-pin-action.yaml does it).
# Every job has one step per version, selected by `if`, and one shared verify step that calls
# tests/check_action_case.sh, so the two runs cannot drift apart. A step that was skipped has no
# outputs: the verify steps read `steps.local.outputs.x || steps.released.outputs.x`.
#
# The pinned release (v0.0.7) is older than the current code: it has the input `package-extra`
# (the current name is `package-extras`), no input `project-path`, `check-types`,
# `twine-version` or `pyright-version`, no outputs, and `dist-type` defaults to `wheel`. The
# released steps use what it has, the jobs that test a newer feature only run on the local
# action, and the outputs are asserted only on the local action. Remove these differences when
# a release catches up.
#
# The jobs use the real uv and the real PyPI, never a fake. The wiring of an input is proven by
# a row with an invalid value: it can only fail if the input reached the script. The logic of
# the checks (every edge case of the metadata, the install, the types) is tested by the bats
# tests of the scripts (tests/bats/), not here.
#
# Two levels of tests:
#   - general behaviour: `test` (the default usage) on every OS and Python version of the matrix,
#     and `test-main-usage` (the README matrix example: extras and dependencies) on every OS of
#     the matrix with one Python version. Only these two jobs cross the OS matrix; the cells of a
#     run are at most os_matrix x python_versions for `test` plus os_matrix for `test-main-usage`
#     (the lists come from durandtibo/workflow-config-action, they are not written here).
#   - edge cases (`test-extra`, `test-tool-versions`, `test-two-invocations`, `test-cases`, ...):
#     one input, one invalid value or one unusual file, on one runner (ubuntu-latest). A new case
#     is a new row of tests/cases.json, not a new job. A row has no "released": true until the
#     last release has the feature (the released run skips those rows). A row that expects a
#     failure follows a positive run on the same runner, so that it cannot fail for the wrong
#     reason.

name: Test Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string
      use-released:
        description: "Test the latest released action instead of the current checkout"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      use-released:
        description: "Test the latest released action instead of the current checkout"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  # Only on a manual run: a caller of this workflow passes the matrix it loaded once.
  get-matrix:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/lib-get-test-matrix.yaml
    permissions:
      contents: read

  # Load the extras from pyproject.toml, plus "" for a baseline "no extra" build.
  get-extras:
    permissions:
      contents: read
    uses: ./.github/workflows/lib-get-package-extras.yaml
    with:
      extra-values: '[""]'

  # The cases of the edge case tests, as a matrix. The released run only gets the rows flagged
  # "released": true.
  get-cases:
    needs: get-matrix
    if: ${{ !cancelled() && (needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped') }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Read the cases
        id: cases
        env:
          USE_RELEASED: ${{ inputs.use-released }}
          TEST_MATRIX: ${{ inputs.test-matrix || needs.get-matrix.outputs.test_matrix }}
        run: |
          set -euo pipefail
          # A row without python-version gets the latest standard version of the shared matrix,
          # so no Python version is written in this workflow.
          cases="$(jq -c --argjson released "$USE_RELEASED" --argjson matrix "$TEST_MATRIX" \
            '($matrix.python_versions_standard | max_by(split(".") | map(tonumber))) as $py
             | (if $released then map(select(.released == true)) else . end)
             | map({"python-version": $py} + .)' tests/cases.json)"
          if [ "$cases" = "[]" ]; then
            echo "❌ No case to run in tests/cases.json (use-released: $USE_RELEASED)" >&2
            exit 1
          fi
          echo "cases=$cases" >> "$GITHUB_OUTPUT"

  # General behaviour: the default usage on every OS and Python version of the matrix
  test:
    needs: get-matrix
    if: ${{ !cancelled() && (needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped') }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).os_matrix }}
        python-version: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).python_versions }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Verify Build (local)
        id: local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          package-name: myproject
          python-version: ${{ matrix.python-version }}

      - name: Verify Build (released)
        id: released
        if: ${{ inputs.use-released }}
        uses: durandtibo/verify-uv-build-action@88da014d506b5f0b4f657d4ba8920061ab785620 # ratchet:durandtibo/verify-uv-build-action@v0.0.7
        with:
          package-name: myproject
          python-version: ${{ matrix.python-version }}

      - name: Check the outputs
        env:
          EXPECT: success
          OUTCOME: success
          EXPECT_OUTPUTS: ${{ !inputs.use-released }}
          WHEEL_PATH: ${{ steps.local.outputs.wheel-path }}
          SDIST_PATH: ${{ steps.local.outputs.sdist-path }}
          DIST_DIR: ${{ steps.local.outputs.dist-dir }}
          VERSION: ${{ steps.local.outputs.version }}
        run: tests/check_action_case.sh
        shell: bash

  # General behaviour: the main documented usage (the README matrix example, with an extra and a
  # dependency) on every OS of the matrix. It does not cross the Python matrix: `test` does.
  test-main-usage:
    needs: get-matrix
    if: ${{ !cancelled() && (needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped') }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).os_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Verify Build (local)
        id: local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          package-name: myproject
          package-extras: all
          package-dependencies: coola

      - name: Verify Build (released)
        id: released
        if: ${{ inputs.use-released }}
        uses: durandtibo/verify-uv-build-action@88da014d506b5f0b4f657d4ba8920061ab785620 # ratchet:durandtibo/verify-uv-build-action@v0.0.7
        with:
          package-name: myproject
          package-extra: all
          package-dependencies: coola

      - name: Check the outputs
        env:
          EXPECT: success
          OUTCOME: success
          EXPECT_OUTPUTS: ${{ !inputs.use-released }}
          WHEEL_PATH: ${{ steps.local.outputs.wheel-path }}
          SDIST_PATH: ${{ steps.local.outputs.sdist-path }}
          DIST_DIR: ${{ steps.local.outputs.dist-dir }}
          VERSION: ${{ steps.local.outputs.version }}
        run: tests/check_action_case.sh
        shell: bash

  # Edge case on one runner: every package extra of pyproject.toml, and no extra
  test-extra:
    needs: get-extras
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        package-extras: ${{ fromJson(needs.get-extras.outputs.extras) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # package-name is omitted: it is read from the wheel
      - name: Verify Build (local)
        id: local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          package-extras: ${{ matrix.package-extras }}
          package-dependencies: coola

      - name: Verify Build (released)
        id: released
        if: ${{ inputs.use-released }}
        uses: durandtibo/verify-uv-build-action@88da014d506b5f0b4f657d4ba8920061ab785620 # ratchet:durandtibo/verify-uv-build-action@v0.0.7
        with:
          package-name: myproject
          package-extra: ${{ matrix.package-extras }}
          package-dependencies: coola

      - name: Check the outputs
        env:
          EXPECT: success
          OUTCOME: success
          EXPECT_OUTPUTS: ${{ !inputs.use-released }}
          WHEEL_PATH: ${{ steps.local.outputs.wheel-path }}
          SDIST_PATH: ${{ steps.local.outputs.sdist-path }}
          DIST_DIR: ${{ steps.local.outputs.dist-dir }}
          VERSION: ${{ steps.local.outputs.version }}
        run: tests/check_action_case.sh
        shell: bash

  #####################################
  #     Tests of failures and cases     #
  #####################################

  # Edge cases on one runner: one row of tests/cases.json per cell. A row optionally breaks the
  # fixture with `setup`, runs the action with the given inputs, and asserts that the outcome is
  # `expect`.
  test-cases:
    needs: get-cases
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        case: ${{ fromJson(needs.get-cases.outputs.cases) }}

    name: ${{ matrix.case.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # A row that expects a failure follows a positive run of the unbroken fixture on the same
      # runner, so that it cannot fail for another reason than its own.
      - name: Positive run before a failure case (local)
        if: ${{ !inputs.use-released && matrix.case.expect == 'failure' }}
        uses: ./
        with:
          package-name: myproject

      - name: Positive run before a failure case (released)
        if: ${{ inputs.use-released && matrix.case.expect == 'failure' }}
        uses: durandtibo/verify-uv-build-action@88da014d506b5f0b4f657d4ba8920061ab785620 # ratchet:durandtibo/verify-uv-build-action@v0.0.7
        with:
          package-name: myproject

      - name: Break the fixture
        if: ${{ matrix.case.setup != '' }}
        env:
          SETUP: ${{ matrix.case.setup }}
        run: bash -euo pipefail -c "$SETUP"

      # The case. A failure is expected for some rows.
      - name: Run the case (local)
        id: local
        if: ${{ !inputs.use-released }}
        continue-on-error: true
        uses: ./
        with:
          package-name: ${{ matrix.case['package-name'] || 'myproject' }}
          module-name: ${{ matrix.case['module-name'] }}
          package-extras: ${{ matrix.case['package-extras'] }}
          package-dependencies: ${{ matrix.case['package-dependencies'] }}
          dist-type: ${{ matrix.case['dist-type'] || 'both' }}
          python-version: ${{ matrix.case['python-version'] }}
          check-types: ${{ matrix.case['check-types'] || 'true' }}
          project-path: ${{ matrix.case['project-path'] || '.' }}
          twine-version: ${{ matrix.case['twine-version'] }}
          pyright-version: ${{ matrix.case['pyright-version'] }}

      # The released action has no check-types, project-path, twine-version and pyright-version
      - name: Run the case (released)
        id: released
        if: ${{ inputs.use-released }}
        continue-on-error: true
        uses: durandtibo/verify-uv-build-action@88da014d506b5f0b4f657d4ba8920061ab785620 # ratchet:durandtibo/verify-uv-build-action@v0.0.7
        with:
          package-name: ${{ matrix.case['package-name'] || 'myproject' }}
          module-name: ${{ matrix.case['module-name'] }}
          package-extra: ${{ matrix.case['package-extras'] }}
          package-dependencies: ${{ matrix.case['package-dependencies'] }}
          dist-type: ${{ matrix.case['dist-type'] || 'wheel' }}
          python-version: ${{ matrix.case['python-version'] }}

      - name: Check the case
        env:
          EXPECT: ${{ matrix.case.expect }}
          OUTCOME: ${{ inputs.use-released && steps.released.outcome || steps.local.outcome }}
          EXPECT_OUTPUTS: ${{ !inputs.use-released }}
          WHEEL_PATH: ${{ steps.local.outputs.wheel-path }}
          SDIST_PATH: ${{ steps.local.outputs.sdist-path }}
          DIST_DIR: ${{ steps.local.outputs.dist-dir }}
          VERSION: ${{ steps.local.outputs.version }}
        run: tests/check_action_case.sh
        shell: bash

  #####################################
  #   Tests of the unreleased features  #
  #####################################

  # Edge case on one runner: the tool version inputs are wired to uvx. The released action does
  # not have these inputs yet. twine must be 7.0.0 or newer: older versions reject the metadata
  # version 2.5 that uv writes. The wiring of twine-version is also proven by the unknown version
  # case of tests/cases.json.
  test-tool-versions:
    if: ${{ !inputs.use-released }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Verify Build
        uses: ./
        with:
          package-name: myproject
          twine-version: 7.0.0
          pyright-version: 1.1.413

  # Regression G1: a second invocation in the same job must not delete the files of the first
  # one. The released action has no outputs yet.
  test-two-invocations:
    if: ${{ !inputs.use-released }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: First run
        id: first
        uses: ./
        with:
          package-name: myproject
          dist-type: wheel

      - name: Second run
        id: second
        uses: ./
        with:
          package-name: myproject
          dist-type: sdist

      - name: Check that the outputs of both runs still exist
        env:
          FIRST_WHEEL: ${{ steps.first.outputs.wheel-path }}
          FIRST_SDIST: ${{ steps.first.outputs.sdist-path }}
          SECOND_WHEEL: ${{ steps.second.outputs.wheel-path }}
          SECOND_SDIST: ${{ steps.second.outputs.sdist-path }}
        run: |
          set -euo pipefail
          for f in "$FIRST_WHEEL" "$FIRST_SDIST" "$SECOND_WHEEL" "$SECOND_SDIST"; do
            if [ ! -f "$f" ]; then
              echo "❌ Expected $f to exist after both runs" >&2
              exit 1
            fi
          done
          if [ "$FIRST_WHEEL" = "$SECOND_WHEEL" ]; then
            echo "❌ Expected two distinct work directories (got $FIRST_WHEEL twice)" >&2
            exit 1
          fi
          echo "✅ Both runs kept their files"

  # The current code against the latest upstream twine and pyright. It runs on the schedule of
  # ci.yaml only (the event of the calling workflow, with the local action), so an upstream
  # release cannot turn a pull request red. A failure is the signal that the pinned defaults
  # need a bump.
  test-latest-tools:
    if: ${{ github.event_name == 'schedule' && !inputs.use-released }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Verify Build
        uses: ./
        with:
          package-name: myproject
          twine-version: latest
          pyright-version: latest
