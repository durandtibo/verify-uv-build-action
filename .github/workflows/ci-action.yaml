# Workflow testing the action from the current repository code (uses: ./)
# across the Python/OS matrix, with every package extra, and checks that each
# failure mode really fails (and each edge case really passes).

name: Test Action

on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  # Load the extras from pyproject.toml, plus "" for a baseline "no extra" build.
  get-extras:
    permissions:
      contents: read
    uses: ./.github/workflows/lib-get-package-extras.yaml
    with:
      extra-values: '[""]'

  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Verify Build
        uses: ./
        with:
          package-name: myproject
          python-version: ${{ matrix.python-version }}

  test-extra:
    permissions:
      contents: read
    needs: get-extras
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        dist-type: ["sdist", "wheel"]
        package-extra: ${{ fromJson(needs.get-extras.outputs.extras) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Verify Build
        uses: ./
        with:
          dist-type: ${{ matrix.dist-type }}
          package-name: myproject
          package-extra: ${{ matrix.package-extra }}
          package-dependencies: coola

  #####################################
  #     Tests of failures and cases     #
  #####################################

  # Load the failure and edge cases from tests/cases.json.
  cases:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cases: ${{ steps.load.outputs.cases }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Load the cases
        id: load
        run: echo "cases=$(scripts/load-cases.sh all)" >> "$GITHUB_OUTPUT"

  # Each case optionally breaks the fixture with `setup`, runs the action with
  # the given inputs, and asserts that the outcome is `expect`.
  test-cases:
    permissions:
      contents: read
    needs: cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.cases.outputs.cases) }}

    name: ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Break the fixture
        if: ${{ matrix.setup != '' }}
        env:
          SETUP: ${{ matrix.setup }}
        run: bash -euo pipefail -c "$SETUP"

      - name: Call composite action
        id: run_action
        uses: ./
        with:
          package-name: ${{ matrix.package-name || 'myproject' }}
          module-name: ${{ matrix.module-name }}
          package-extra: ${{ matrix.package-extra }}
          package-dependencies: ${{ matrix.package-dependencies }}
          dist-type: ${{ matrix.dist-type || 'wheel' }}
          check-types: ${{ matrix.check-types || 'true' }}
          project-path: ${{ matrix.project-path || '.' }}
        continue-on-error: true

      - name: Check the outcome
        env:
          EXPECTED: ${{ matrix.expect }}
          OUTCOME: ${{ steps.run_action.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "$EXPECTED" ]; then
            echo "❌ Expected the action to end with '$EXPECTED' but got '$OUTCOME'" >&2
            exit 1
          fi
          echo "✅ The action ended with '$OUTCOME' as expected"

  # Checks that the tool version inputs are wired to uvx.
  test-tool-versions:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Verify Build
        uses: ./
        with:
          package-name: myproject
          twine-version: 6.2.0
          pyright-version: 1.1.413
