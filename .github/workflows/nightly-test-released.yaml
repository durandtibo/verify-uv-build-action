# Workflow testing the latest released action, to catch regressions in what
# consumers pick up. It mirrors ci-action.yaml (which tests the current checkout)
# with the pinned release instead of `uses: ./` and only the cases of
# tests/cases.json flagged "released". tests/bats/test_workflow_mirror.bats
# keeps the two files aligned: edit ci-action.yaml first, then mirror the change.
# On a release: bump the pinned SHA and the ratchet comment below, flip the
# "released" flags in tests/cases.json and shrink the allow-list of the test.

name: Test Released Action

on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  # Load the extras from pyproject.toml, plus "" for a baseline "no extra" build.
  get-extras:
    permissions:
      contents: read
    uses: ./.github/workflows/lib-get-package-extras.yaml
    with:
      extra-values: '[""]'

  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Verify Build
        uses: durandtibo/verify-uv-build-action@88da014d506b5f0b4f657d4ba8920061ab785620 # ratchet:durandtibo/verify-uv-build-action@v0.0.7
        with:
          package-name: myproject
          python-version: ${{ matrix.python-version }}

  test-extra:
    permissions:
      contents: read
    needs: get-extras
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        package-extra: ${{ fromJson(needs.get-extras.outputs.extras) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Verify Build
        uses: durandtibo/verify-uv-build-action@88da014d506b5f0b4f657d4ba8920061ab785620 # ratchet:durandtibo/verify-uv-build-action@v0.0.7
        with:
          package-name: myproject
          package-extra: ${{ matrix.package-extra }}
          package-dependencies: coola

  #####################################
  #     Tests of failures and cases     #
  #####################################

  # Load the failure and edge cases from tests/cases.json.
  cases:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cases: ${{ steps.load.outputs.cases }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Load the cases
        id: load
        run: echo "cases=$(scripts/load-cases.sh released)" >> "$GITHUB_OUTPUT"

  # Each case optionally breaks the fixture with `setup`, runs the action with
  # the given inputs, and asserts that the outcome is `expect`.
  test-cases:
    permissions:
      contents: read
    needs: cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.cases.outputs.cases) }}

    name: ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Break the fixture
        if: ${{ matrix.setup != '' }}
        env:
          SETUP: ${{ matrix.setup }}
        run: bash -euo pipefail -c "$SETUP"

      - name: Call composite action
        id: run_action
        uses: durandtibo/verify-uv-build-action@88da014d506b5f0b4f657d4ba8920061ab785620 # ratchet:durandtibo/verify-uv-build-action@v0.0.7
        with:
          package-name: ${{ matrix.package-name || 'myproject' }}
          module-name: ${{ matrix.module-name }}
          package-extra: ${{ matrix.package-extra }}
          package-dependencies: ${{ matrix.package-dependencies }}
          dist-type: ${{ matrix.dist-type || 'wheel' }}
          check-types: ${{ matrix.check-types || 'true' }}
          project-path: ${{ matrix.project-path || '.' }}
        continue-on-error: true

      - name: Check the outcome
        env:
          EXPECTED: ${{ matrix.expect }}
          OUTCOME: ${{ steps.run_action.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "$EXPECTED" ]; then
            echo "❌ Expected the action to end with '$EXPECTED' but got '$OUTCOME'" >&2
            exit 1
          fi
          echo "✅ The action ended with '$OUTCOME' as expected"
