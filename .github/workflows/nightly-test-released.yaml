# Workflow testing the latest released action, to catch regressions in what
# consumers pick up. It mirrors the tests of ci-action.yaml, which tests the
# current checkout instead. Update the pinned release below when a new version
# is released.

name: Test Released Action

on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  # Load the extras from pyproject.toml, plus "" for a baseline "no extra" build.
  get-extras:
    permissions:
      contents: read
    uses: ./.github/workflows/lib-get-package-extras.yaml
    with:
      extra-values: '[""]'

  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Verify Build
        uses: durandtibo/verify-uv-build-action@88da014d506b5f0b4f657d4ba8920061ab785620 # ratchet:durandtibo/verify-uv-build-action@v0.0.7
        with:
          package-name: myproject
          python-version: ${{ matrix.python-version }}

  test-extra:
    permissions:
      contents: read
    needs: get-extras
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        dist-type: ["sdist", "wheel"]
        package-extra: ${{ fromJson(needs.get-extras.outputs.extras) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Verify Build
        uses: durandtibo/verify-uv-build-action@88da014d506b5f0b4f657d4ba8920061ab785620 # ratchet:durandtibo/verify-uv-build-action@v0.0.7
        with:
          dist-type: ${{ matrix.dist-type }}
          package-name: myproject
          package-extra: ${{ matrix.package-extra }}
          package-dependencies: coola

  #################################
  #     Tests to check inputs     #
  #################################

  invalid-dist-type:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Call composite action with invalid value
        id: run_action
        uses: durandtibo/verify-uv-build-action@88da014d506b5f0b4f657d4ba8920061ab785620 # ratchet:durandtibo/verify-uv-build-action@v0.0.7
        with:
          dist-type: tar
          package-name: myproject
        continue-on-error: true

      - name: Failure - it did not fail as expected
        if: steps.run_action.outcome != 'failure'
        run: |
          echo "❌ Error: Step should have failed but didn't!"
          exit 1

      - name: Success - it failed as expected
        if: steps.run_action.outcome == 'failure'
        run: echo "✅ Test passed - step failed as expected"

  missing-py-typed:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Remove py.typed
        run: |
          rm src/myproject/py.typed

      - name: Call composite action
        id: run_action
        uses: durandtibo/verify-uv-build-action@88da014d506b5f0b4f657d4ba8920061ab785620 # ratchet:durandtibo/verify-uv-build-action@v0.0.7
        with:
          package-name: myproject
        continue-on-error: true

      - name: Failure - it did not fail as expected
        if: steps.run_action.outcome != 'failure'
        run: |
          echo "❌ Error: Step should have failed but didn't!"
          exit 1

      - name: Success - it failed as expected
        if: steps.run_action.outcome == 'failure'
        run: echo "✅ Test passed - step failed as expected"

  incorrect-extra:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Call composite action
        id: run_action
        uses: durandtibo/verify-uv-build-action@88da014d506b5f0b4f657d4ba8920061ab785620 # ratchet:durandtibo/verify-uv-build-action@v0.0.7
        with:
          package-name: myproject
          package-extra: missing
        continue-on-error: true

      - name: Failure - it did not fail as expected
        if: steps.run_action.outcome != 'failure'
        run: |
          echo "❌ Error: Step should have failed but didn't!"
          exit 1

      - name: Success - it failed as expected
        if: steps.run_action.outcome == 'failure'
        run: echo "✅ Test passed - step failed as expected"

  incorrect-extra-skip:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      action_failed: ${{ steps.run_action.outcome == 'failure' }}
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Call composite action
        id: run_action
        uses: durandtibo/verify-uv-build-action@88da014d506b5f0b4f657d4ba8920061ab785620 # ratchet:durandtibo/verify-uv-build-action@v0.0.7
        with:
          package-name: myproject
          package-extra: missing
          verify-wheel-extra: false
          verify-sdist-extra: false
