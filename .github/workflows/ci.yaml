# Main CI workflow that orchestrates all quality checks and tests.
# Runs on pull requests, pushes to main, a nightly schedule, and manual dispatch.
# It tests the current repository code, including the action
# that is not released yet.
#
# Deliberately NOT called from here, with its own trigger:
#   - ci-verify-workflows.yaml: lints .github/workflows/* itself.
#
# Permissions are set at the job level, not the workflow level.
#
# The individual check jobs below call out to per-check reusable workflows
# (ci-format.yaml, ...) instead of inlining their steps here, so each check
# can still be run on its own (workflow_dispatch).

name: CI
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "10 9 * * *" # Run nightly at 9:10 AM UTC to catch issues from external changes
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  # Load the shared Python-version and OS matrices from the default config of
  # durandtibo/workflow-config-action once, and pass them down to every job
  # below that needs them.
  get-matrix:
    uses: ./.github/workflows/lib-get-test-matrix.yaml
    permissions:
      contents: read

  # Verify formatting and linting of the repository files
  format:
    uses: ./.github/workflows/ci-format.yaml
    permissions:
      contents: read

  # Run the bats unit tests of the shell scripts on multiple OS
  shell:
    needs: get-matrix
    uses: ./.github/workflows/ci-shell.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
    permissions:
      contents: read

  # Run the bats unit tests of the shell scripts with the system bash 3.2 of macOS
  shell-bash32:
    needs: get-matrix
    uses: ./.github/workflows/ci-shell-bash32.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
    permissions:
      contents: read

  # Test the action from the current repository code (not released yet)
  action:
    needs: get-matrix
    uses: ./.github/workflows/ci-action.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
    permissions:
      contents: read
