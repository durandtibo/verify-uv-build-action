# Formatting and linting workflow.
# Checks shell, Markdown, and YAML files follow the project style guidelines.
# Each check runs through the Makefile, so it can be reproduced locally.

name: Format
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # make lint-shell/check-format-shell use `xargs -r`, so they no-op
      # cleanly when the repo has no shell scripts.
      - name: Check shell formatting
        run: |
          make check-format-shell

      - name: Lint shell scripts
        run: |
          make lint-shell

  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Lint Markdown files
        run: |
          make lint-markdown

  yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Lint YAML files
        run: |
          make lint-yaml
