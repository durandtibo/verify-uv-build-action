# Formatting and linting workflow.
# Checks that the files are formatted (`make format` leaves no change) and that the
# Markdown, shell, YAML, Makefile, TOML and workflow files pass the linters (`make lint`),
# and that no bats assertion passes vacuously on bash 3.2 (`make lint-bats`).
# Each check runs through the Makefile, so it can be reproduced locally.

name: Format
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  format:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Format
        run: |
          make format

      - name: Check for changes
        run: |
          git diff --exit-code

  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Lint
        run: |
          make lint

      - name: Lint the bats assertions
        run: |
          make lint-bats
